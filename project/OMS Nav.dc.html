<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet data-dc-atomics><link rel="preconnect" href="https://fonts.gstatic.com"><link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Sans+Thai:wght@400;500;700&display=swap"></helmet>
<div style="width:240px;flex:none;background:#15181E;color:#fff;font-family:'Noto Sans Thai',Arial,sans-serif;display:flex;flex-direction:column;height:100%;overflow:hidden">
  <div style="display:flex;align-items:center;gap:10px;padding:18px 16px 16px">
    <div style="width:34px;height:34px;flex:none;border-radius:8px;background:#D71920;display:flex;align-items:center;justify-content:center;font-weight:700;font-size:15px">B</div>
    <div style="line-height:1.15">
      <div style="font-size:13px;font-weight:700;letter-spacing:.06em">BEAUTRIUM</div>
      <div style="font-size:11px;color:#9CA3AF">Order Management</div>
    </div>
  </div>
  <nav style="flex:1;min-height:0;overflow-y:auto;padding:2px 8px 6px;display:flex;flex-direction:column;gap:0">
    <sc-for list="{{ items }}" as="it" hint-placeholder-count="18">
      <div style="padding:{{ it.pad }};font-size:{{ it.size }};color:{{ it.fg }};background:{{ it.bg }};border-radius:7px;letter-spacing:{{ it.ls }};font-weight:{{ it.weight }};text-transform:{{ it.tt }};line-height:1.25;display:flex;align-items:center;gap:8px">
        <span style="flex:1">{{ it.en }}<span style="display:block;font-size:10.5px;color:{{ it.thfg }};font-weight:400">{{ it.th }}</span></span>
        <span style="font-size:10.5px;color:{{ it.badgefg }}">{{ it.badge }}</span>
      </div>
    </sc-for>
  </nav>
  <div style="border-top:1px solid #262B33;padding:12px 14px;display:flex;align-items:center;gap:10px">
    <div style="width:30px;height:30px;border-radius:50%;background:#374151;flex:none"></div>
    <div style="line-height:1.25;flex:1">
      <div style="font-size:12.5px;font-weight:500">Somsak P.</div>
      <div style="font-size:10.5px;color:#9CA3AF">Supervisor · Bangna DC</div>
    </div>
    <span style="width:7px;height:7px;border-radius:50%;background:#16A34A"></span>
  </div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props="{&quot;$preview&quot;:{&quot;width&quot;:240,&quot;height&quot;:900},&quot;active&quot;:{&quot;editor&quot;:&quot;int&quot;,&quot;default&quot;:1,&quot;tsType&quot;:&quot;number&quot;}}">
class Component extends DCLogic {
  renderVals() {
    const active = this.props.active ?? 1;
    const groups = [
      ["Overview", [[1, "Operations Dashboard", "แดชบอร์ดปฏิบัติการ", ""]]],
      ["Order Core", [[2, "Order Pool / Import Status", "พูลออเดอร์ / สถานะนำเข้า", "1,248"]]],
      ["Consolidation", [
        [3, "Matching Dashboard", "แดชบอร์ดการจับคู่", ""],
        [4, "Matching Analysis & Batch Review", "วิเคราะห์การจับคู่ / ตรวจแบตช์", ""],
        [5, "Consolidation Pick Report", "รายงานหยิบรวม", ""],
        [6, "Consolidation History", "ประวัติการรวมออเดอร์", ""]]],
      ["Picking Control", [
        [7, "Work Assignment", "มอบหมายงาน", "22"],
        [8, "Picker Monitor", "ติดตามผู้หยิบสินค้า", ""],
        [9, "Zone Dashboard", "แดชบอร์ดโซน", ""],
        [10, "Control Tower", "ศูนย์ควบคุม", ""],
        [11, "Backlog Monitor", "งานคงค้าง", "185"]]],
      ["Analytics", [[12, "Productivity / SLA / Short Pick", "ผลิตภาพ / SLA / หยิบขาด", ""]]],
      ["Administration", [
        [13, "User Management", "จัดการผู้ใช้งาน", ""],
        [14, "Location Master", "ข้อมูลตำแหน่งจัดเก็บ", ""],
        [15, "Configuration / Audit", "ตั้งค่า / ตรวจสอบ", ""]]]
    ];
    const items = [];
    groups.forEach(([name, rows], gi) => {
      items.push({ en: name, th: "", badge: "", pad: (gi ? "9px 8px 3px" : "4px 8px 3px"), size: "10px",
        fg: "#6B7280", thfg: "#6B7280", badgefg: "#6B7280", bg: "transparent", ls: ".09em", weight: "700", tt: "uppercase" });
      rows.forEach(([n, en, th, badge]) => {
        const on = n === active;
        items.push({ en: n + ". " + en, th, badge, pad: "4px 10px", size: "12.5px",
          fg: on ? "#fff" : "#D1D5DB", thfg: on ? "rgba(255,255,255,.72)" : "#6B7280",
          badgefg: on ? "rgba(255,255,255,.85)" : "#9CA3AF",
          bg: on ? "#D71920" : "transparent", ls: "0", weight: on ? "700" : "400", tt: "none" });
      });
    });
    return { items };
  }
}
</script>
</body>
</html>
